plugins {
	id 'com.github.johnrengelman.shadow' version '8.1.1'
	id 'dev.architectury.loom' version '1.4-SNAPSHOT'
	id 'maven-publish'
}

loom {
	silentMojangMappingsLicense()
	accessWidenerPath = file("src/main/resources/iris.accesswidener")

	forge {
		convertAccessWideners = true
		mixinConfigs = [
				"mixins.oculus.json",
				"mixins.oculus.fantastic.json",
				"mixins.oculus.vertexformat.json",
				"mixins.oculus.bettermipmaps.json",
				"mixins.oculus.fixes.maxfpscrash.json",
				"oculus-batched-entity-rendering.mixins.json",
				"mixins.oculus.compat.sodium.json",
				"mixins.oculus.compat.indigo.json",
				"mixins.oculus.compat.indium.json",
				"mixins.oculus.compat.dh.json",
				"mixins.oculus.compat.pixelmon.json",
				"mixins.oculus.compat.flywheel.json"
		]
	}
	mixin.defaultRefmapName = "oculus-mixins-refmap.json"
}

configurations {
	shadow {
		transitive = false
	}
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = "${project.archives_base_name}-mc${project.minecraft_version}"
version = project.mod_version
group = project.maven_group

sourceSets {
	desktop {
	}

	vendored {
		java {
			compileClasspath += main.compileClasspath
		}
	}

	sodiumCompatibility {
		java {
			compileClasspath += main.compileClasspath
			compileClasspath += main.output
		}
	}

	main {
		java {
			compileClasspath += vendored.output
			runtimeClasspath += vendored.output
		}
	}

	devbench {
		java {
			compileClasspath += main.compileClasspath
			compileClasspath += main.output
		}
	}
}

loom {
	runs {
		client {
			mods {
				oculus {
					sourceSet sourceSets.desktop
					sourceSet sourceSets.main
					sourceSet sourceSets.vendored
					sourceSet sourceSets.sodiumCompatibility
					sourceSet sourceSets.devbench
				}
			}
			vmArgs "-Xmx4G"
		}
	}
}

repositories {
	maven {
		name = "CurseForge"
		url = "https://cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		url "https://maven.blamejared.com/"
	}
	maven {
		url "https://maven.neoforged.net/releases"
	}
	maven {
		url "https://maven.createmod.net"
		content {
			includeGroup "dev.engine-room.flywheel"
			includeGroup "com.simibubi.create"
			includeGroup "net.createmod.ponder"
		}
	}
	maven {
		url "https://maven.tterrag.com/"
		content {
			includeGroup "com.tterrag.registrate"
		}
	}
	mavenLocal()
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.officialMojangMappings()
	forge "net.neoforged:forge:${minecraft_version}-${forge_version}"

	modImplementation "com.misanthropy:emberbium-${minecraft_version}:${emberbium_version}"
	modCompileOnly("maven.modrinth:distanthorizonsapi:3.0.0")
	modCompileOnly("dev.engine-room.flywheel:flywheel-forge-1.20.1:1.0.5") { transitive = false }
	modLocalRuntime("dev.engine-room.flywheel:flywheel-forge-1.20.1:1.0.5") { transitive = false }
	modLocalRuntime("com.simibubi.create:create-1.20.1:6.0.8-291:slim") { transitive = false }
	modLocalRuntime("net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91") { transitive = false }
	modLocalRuntime("com.tterrag.registrate:Registrate:MC1.20-1.3.3") { transitive = false }
	modLocalRuntime("io.github.llamalad7:mixinextras-forge:0.4.1")
	forgeRuntimeLibrary("io.github.llamalad7:mixinextras-common:0.4.1")
	modLocalRuntime files("C:/Users/egecr/curseforge/minecraft/Instances/Linggango Developer Version/mods/createbetterfps-1.20.1-1.1.3.jar")

	compileOnly("io.github.llamalad7:mixinextras-common:0.3.5")
	annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.5")
	sodiumCompatibilityCompileOnly("io.github.llamalad7:mixinextras-common:0.3.5")
	sodiumCompatibilityAnnotationProcessor("io.github.llamalad7:mixinextras-common:0.3.5")

	forgeRuntimeLibrary(implementation(shadow(project(path: ":glsl-relocated", configuration: "bundledJar")))) {
		transitive = false
	}
	forgeRuntimeLibrary(implementation(include("org.anarres:jcpp:1.4.14")))
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/mods.toml") {
		expand "version": project.version
	}
}

shadowJar {
	configurations = [project.configurations.shadow]

	from jar.archiveFile

	relocate 'org.apache.commons.collections4', 'oculus.org.apache.commons.collections4'

	archiveClassifier.set "shadow"

	manifest {
		attributes(
				'Main-Class': 'net.irisshaders.iris.LaunchWarn'
		)
	}
}

remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
}

jar {
	from sourceSets.sodiumCompatibility.output
	from sourceSets.vendored.output
	from sourceSets.desktop.output
}

java {
	withSourcesJar()
}

sourcesJar {
	from sourceSets.sodiumCompatibility.allSource
	from sourceSets.vendored.allSource
	from sourceSets.desktop.allSource
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}

tasks.named("runClient") {
	dependsOn "devbenchClasses"
}
